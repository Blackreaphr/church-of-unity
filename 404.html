<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not Found | Church of Unity</title>
    <meta name="description" content="Page not found." />
    <meta name="theme-color" content="#0b0c10" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/assets/symbol.svg" type="image/svg+xml" />
    <script>
      (function fallbackRedirect(){
        try {
          var p = location.pathname;
          // Avoid loops from our own 404 page
          if (/\bco404=1\b/.test(location.search)) return;
          if (p === '/' || p.toLowerCase() === '/404.html') return;
          // If the path has no extension, try .html or index.html
          if (!/\.[a-z0-9]+$/i.test(p)) {
            var next = p.endsWith('/') ? (p + 'index.html') : (p + '.html');
            var u = new URL(next, location.origin);
            u.searchParams.set('co404','1');
            location.replace(u.href);
          }
        } catch {}
      })();
    </script>
    <link rel="stylesheet" crossorigin href="/assets/main-8BzZRDYf.css">
  </head>
  <body>
    <main class="container" style="padding:48px 0">
      <h1 style="font-family: var(--font-serif); margin:0 0 8px">Page not found</h1>
      <p class="muted">If you typed a clean URL, try the .html version.</p>
      <p style="margin-top:12px"><a href="/index.html">Go to Home</a></p>
    </main>
  </body>
 </html>
