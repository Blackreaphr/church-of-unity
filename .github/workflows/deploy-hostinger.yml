name: Deploy to Hostinger (SFTP)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'assets/**'
      - 'site/**'
      - 'scripts/**'
      - 'essays/**'
      - 'forum/**'
      - 'forum-feed/**'
      - 'guides/**'
      - '.htaccess'
      - '*.html'
      - 'styles.css'
      - 'main.js'
      - 'vite.config.*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-hostinger.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      REMOTE_DIR: ${{ secrets.HST_REMOTE_DIR || 'domains/thechurchofunity.com/public_html' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Debug workspace + lockfile
        run: |
          pwd
          ls -la
          node -v
          npm -v
          if [ -f package-lock.json ]; then echo "LOCKFILE: present"; wc -l package-lock.json; else echo "LOCKFILE: missing"; fi

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "package-lock.json not found; running npm install"
            npm install
          fi

      - name: Build (with version stamping)
        run: npm run build:stamp

      - name: Copy root assets to dist (css/js/site)
        run: |
          mkdir -p dist
          # Copy top-level assets that are referenced by absolute paths
          [ -f styles.css ] && cp -f styles.css dist/styles.css || true
          [ -f main.js ] && cp -f main.js dist/main.js || true
          [ -d site ] && rsync -a site/ dist/site/ || true
          [ -d assets ] && rsync -a assets/ dist/assets/ || true

      - name: Verify build artifacts
        run: |
          echo "Listing dist/ contents:"
          ls -la dist || true
          echo "Sample HTML head:"
          (head -n 40 dist/index.html || true) | sed -n '1,12p'
          echo "Check purgatory files exist:"
          [ -f dist/purgatory.html ] && echo "OK: dist/purgatory.html" || (echo "MISSING: dist/purgatory.html" && exit 1)
          [ -f dist/purgatory/index.html ] && echo "OK: dist/purgatory/index.html" || (echo "MISSING: dist/purgatory/index.html" && exit 1)

      # REMOTE_DIR is set at job-level env with a fallback above

      - name: Install lftp for preflight
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Preflight SFTP (check remote dir)
        shell: bash
        env:
          H: ${{ secrets.HST_HOST }}
          P: ${{ secrets.HST_PORT }}
          U: ${{ secrets.HST_USER }}
          W: ${{ secrets.HST_PASS }}
          R: ${{ env.REMOTE_DIR }}
        run: |
          set -e
          echo "Secrets presence (masked):"
          [ -n "$H" ] && echo "HST_HOST: set" || echo "HST_HOST: MISSING"
          [ -n "$P" ] && echo "HST_PORT: set" || echo "HST_PORT: MISSING"
          [ -n "$U" ] && echo "HST_USER: set" || echo "HST_USER: MISSING"
          if [ -n "$W" ]; then echo "HST_PASS: set"; else echo "HST_PASS: MISSING"; fi
          [ -n "$R" ] && echo "HST_REMOTE_DIR: set -> $R" || echo "HST_REMOTE_DIR: MISSING"
          echo "Listing remote dir: $R on $H:$P"
          lftp -u "$U","$W" -p "$P" sftp://"$H" -e "set net:timeout 10; set net:max-retries 2; set sftp:auto-confirm yes; cls -la \"$R\"; bye" || {
            echo "Preflight failed. Verify HST_* secrets and HST_REMOTE_DIR path." >&2
            exit 1
          }

      - name: Deploy via SFTP
        uses: pressidium/lftp-mirror-action@v1
        with:
          host: ${{ secrets.HST_HOST }}
          port: ${{ secrets.HST_PORT }}
          user: ${{ secrets.HST_USER }}
          pass: ${{ secrets.HST_PASS }}
          localDir: dist
          remoteDir: ${{ env.REMOTE_DIR }}
          options: --verbose --parallel=8 --include-glob .htaccess --exclude-glob .git* --exclude-glob .github/** --exclude-glob cloudflare/** --exclude-glob node_modules/** --exclude-glob scripts/** --exclude-glob *.map --exclude-glob *.md --delete
